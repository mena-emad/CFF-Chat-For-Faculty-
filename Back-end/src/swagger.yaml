paths:
  /chat:
    post:
      tags:
        - AI
      summary: Sends a user prompt to the AI and receives a generated response.
      description: This endpoint allows users to send a text prompt to the AI service.
        The AI controller first passes the prompt to the AI service. The service
        then validates the prompt to ensure it's provided and is a string. If
        validation fails, it throws an `AppError` resulting in a 400 Bad
        Request. Otherwise, it delegates to an underlying AI repository to
        generate a response and returns it directly to the client with a 200 OK
        status.
      requestBody:
        description: User prompt to be sent to the AI.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIChatRequest"
      responses:
        "200":
          description: Successfully received AI-generated response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIChatResponse"
        "400":
          description: "Bad Request: Invalid or missing prompt."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error: Something went wrong on the server during
            AI processing or response generation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    AIChatRequest:
      type: object
      description: Schema for the request body when sending a prompt to the AI.
      required:
        - prompt
      properties:
        prompt:
          type: string
          description: The user's query or statement to be processed by the AI.
          example: What is the capital of France?
    AIChatResponse:
      type: object
      description: Schema for the successful AI-generated response.
      properties:
        message:
          type: string
          description: The AI's generated response to the provided prompt.
          example: The capital of France is Paris.
    ErrorResponse:
      type: object
      description: Generic error response format.
      properties:
        status:
          type: string
          description: Indicates the status of the response, typically 'fail' or 'error'.
          example: fail
        message:
          type: string
          description: A descriptive error message.
          example: Please provide a valid prompt
        statusCode:
          type: integer
          description: The HTTP status code for the error.
          example: 400
